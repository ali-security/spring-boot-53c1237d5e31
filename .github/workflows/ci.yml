name: CI
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task and --tests selectors to run instead of the scoped build (empty = scoped build)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: '${{ matrix.os.name}} | Java ${{ matrix.java.version}}'
    runs-on: ${{ matrix.os.id }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: ubuntu-latest
            name: Linux
          - id: windows-latest
            name: Windows
        java:
          - version: 17
            toolchain: false
          - version: 21
            toolchain: true
          - version: 22
            toolchain: true
        exclude:
          - os:
              name: Linux
            java:
              version: 17
    steps:
      - name: Prepare Windows runner
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.autocrlf true
          git config --global core.longPaths true
          Stop-Service -name Docker
      - name: Prepare Linux runner
        if: ${{ runner.os == 'Linux' }}
        run: |
          docker version
          echo 'api.version=1.44' > "$HOME/.docker-java.properties"
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java.version }}
          java-toolchain: ${{ matrix.java.toolchain }}
          gradle-enterprise-secret-access-key: ${{ secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
          gradle-enterprise-cache-user: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USER }}
          gradle-enterprise-cache-password: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          build-tasks: ${{ inputs.test-filter != '' && format(':spring-boot-project:spring-boot-actuator-autoconfigure:assemble {0} -x checkstyleMain -x checkstyleTest -x checkFormatMain -x checkFormatTest -x checkArchitectureMain -x checkArchitectureTest', inputs.test-filter) || ':spring-boot-project:spring-boot-actuator-autoconfigure:build :spring-boot-project:spring-boot-actuator:test -x checkstyleMain -x checkstyleTest -x checkFormatMain -x checkFormatTest -x checkArchitectureMain -x checkArchitectureTest' }}
